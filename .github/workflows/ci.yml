name: CI

# Git Flow: long-lived `main` (production) + `develop` (integration); short-lived
# feature/*, release/* and hotfix/* branches. With a rebase workflow history stays
# linear. Run on pushes to the integration/release branches and on PRs into them.
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
